# Base de dados PostgreSQL para desenvolvimento local.
# As credenciais vêm do ficheiro .env na raiz (ver .env.example). Nunca usar em produção tal como está.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ashley-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ashley_portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-ashley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    ports:
      # Apenas na interface local; a base de dados não fica exposta à rede.
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - ashley_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ashley_pgdata:
