<!doctype html>
<html lang="pt-MZ">
  <head>
    <script>
      ;(function () {
        try {
          var key = 'ashley-appearance'
          var stored = localStorage.getItem(key)
          var dark =
            stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashley da Amena Mario Malate — Desenvolvedora de software</title>

      name="description"
      content="Portfólio de Ashley da Amena Mario Malate, estudante de Informática e desenvolvedora de aplicações web e móveis em Maputo, Moçambique."
    />
